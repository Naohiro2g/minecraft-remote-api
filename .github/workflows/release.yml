name: Release

on:
  release:
    types: [published]
  # 既存 Release の asset を TestPyPI へ出し直す復旧経路。main の本ファイルで実行されるため、
  # publish job の修正を tag の作り直しなしで適用できる（promote は実行しない）
  workflow_dispatch:
    inputs:
      tag:
        description: "publish する既存 Release の tag（例: v2301.0.0b7.post3）"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  promote:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the commit the release tag points to
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG_NAME="${{ github.event.release.tag_name }}"
          SOURCE_COMMIT=$(gh api "repos/${{ github.repository }}/commits/$TAG_NAME" -q .sha)
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"

      - name: Find the matching successful ci.yml run for that commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh api --method GET "repos/${{ github.repository }}/actions/workflows/ci.yml/runs" \
            -f head_sha="$SOURCE_COMMIT" -f status=success -q '.workflow_runs[0].id')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::commit $SOURCE_COMMIT に対応する成功済み ci.yml run が見つからない。release.yml は再build しない設計のため自動フォールバックしない -- このcommitで ci.yml を再実行（再push または workflow_dispatch）してから、あらためて release を作成し直してください（retention-days=90 を超えている場合も同様）"
            exit 1
          fi
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Download the candidate artifact (bytes unchanged)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -n minecraft-remote-api-dist -D dist-candidate --repo "${{ github.repository }}"
          WHEEL=$(find dist-candidate -name '*.whl')
          SDIST=$(find dist-candidate -name '*.tar.gz')
          CANDIDATE_MANIFEST=$(find dist-candidate -name 'manifest.json')
          echo "WHEEL=$WHEEL" >> "$GITHUB_ENV"
          echo "SDIST=$SDIST" >> "$GITHUB_ENV"
          echo "CANDIDATE_MANIFEST=$CANDIDATE_MANIFEST" >> "$GITHUB_ENV"

      - name: Verify the release tag matches the candidate wheel's version
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG_NAME#v}"
          PROJECT_VERSION=$(basename "$WHEEL" | sed -E 's/^minecraft_remote_api-(.+)-py3-none-any\.whl$/\1/')
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::tag '$TAG_NAME' の version '$TAG_VERSION' が候補wheelの version '$PROJECT_VERSION' と一致しない（version bumpを忘れていませんか）"
            exit 1
          fi
          echo "TAG_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Verify the prerelease flag matches the version suffix
        run: |
          set -euo pipefail
          if [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(b|rc)[0-9]+ ]]; then
            if [ "${{ github.event.release.prerelease }}" != "true" ]; then
              echo "::error::'$TAG_NAME' は pre-release 形式だが GitHub release 側に prerelease フラグが立っていない"
              exit 1
            fi
          else
            if [ "${{ github.event.release.prerelease }}" != "false" ]; then
              echo "::error::'$TAG_NAME' は stable 形式だが GitHub release 側に prerelease フラグが立っている"
              exit 1
            fi
          fi

      - name: Verify downloaded bytes match what ci.yml tested
        run: |
          set -euo pipefail
          for role_file in "wheel:$WHEEL" "sdist:$SDIST"; do
            role="${role_file%%:*}"
            file="${role_file#*:}"
            actual=$(sha256sum "$file" | cut -d' ' -f1)
            expected=$(jq -r --arg r "$role" '.artifacts[] | select(.role==$r) | .sha256' "$CANDIDATE_MANIFEST")
            if [ "$actual" != "$expected" ]; then
              echo "::error::$role の sha256 が候補 manifest の記録値と不一致（download破損等）"
              exit 1
            fi
          done

      - name: Relabel manifest.json with the actual release tag
        run: |
          set -euo pipefail
          jq --arg t "$TAG_NAME" '.release_tag = $t' "$CANDIDATE_MANIFEST" > manifest.json
          cat manifest.json

      - name: Attach wheel, sdist and manifest.json to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$TAG_NAME" "$WHEEL" "$SDIST" manifest.json \
            --repo "${{ github.repository }}" --clobber

  # soak（versioning-design §10.9）: Release asset と同じ bytes を TestPyPI へ出す。
  # 再 build しない。Trusted Publishing（OIDC）で publish し、API token は使わない。
  # TestPyPI の Trusted Publisher 登録値: workflow=release.yml, environment=testpypi
  publish-testpypi:
    needs: promote
    if: >-
      ${{ !cancelled() && (needs.promote.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && needs.promote.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/minecraft-remote-api
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve the tag to publish
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG_NAME="${EVENT_TAG:-$INPUT_TAG}"
          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((b|rc)[0-9]+)?(\.post[0-9]+)?$ ]]; then
            echo "::error::tag '$TAG_NAME' は release tag の形式ではない"
            exit 1
          fi
          SOURCE_COMMIT=$(gh api "repos/${{ github.repository }}/commits/$TAG_NAME" -q .sha)
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"

      - name: Download the Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$TAG_NAME" --repo "${{ github.repository }}" -D release-assets \
            -p '*.whl' -p '*.tar.gz' -p manifest.json

      - name: Verify the assets against manifest.json
        run: |
          set -euo pipefail
          MANIFEST=release-assets/manifest.json
          if [ "$(jq -r .release_tag "$MANIFEST")" != "$TAG_NAME" ]; then
            echo "::error::manifest.json の release_tag が '$TAG_NAME' と一致しない"
            exit 1
          fi
          if [ "$(jq -r .source_commit "$MANIFEST")" != "$SOURCE_COMMIT" ]; then
            echo "::error::manifest.json の source_commit が tag の commit $SOURCE_COMMIT と一致しない"
            exit 1
          fi
          mkdir dist
          for role in wheel sdist; do
            file=$(jq -r --arg r "$role" '.artifacts[] | select(.role==$r) | .file' "$MANIFEST")
            expected=$(jq -r --arg r "$role" '.artifacts[] | select(.role==$r) | .sha256' "$MANIFEST")
            actual=$(sha256sum "release-assets/$file" | cut -d' ' -f1)
            if [ "$actual" != "$expected" ]; then
              echo "::error::$file の sha256 が manifest.json の記録値と一致しない"
              exit 1
            fi
            mv "release-assets/$file" dist/
          done
          VERSION=$(basename dist/*.whl | sed -E 's/^minecraft_remote_api-(.+)-py3-none-any\.whl$/\1/')
          if [ "$VERSION" != "${TAG_NAME#v}" ]; then
            echo "::error::wheel の version '$VERSION' が tag '$TAG_NAME' と一致しない"
            exit 1
          fi
          ls -l dist

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"

      - name: Publish to TestPyPI (Trusted Publishing)
        run: |
          set -euo pipefail
          # --check-url: 同じ file が既にあれば skip するので、再実行しても安全
          uv publish --trusted-publishing always \
            --publish-url https://test.pypi.org/legacy/ \
            --check-url https://test.pypi.org/simple/ \
            dist/*
