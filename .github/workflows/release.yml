name: Release

on:
  release:
    types: [published]
  # 選択した実行refのworkflowで、既存Releaseのassetを指定indexへ公開する。
  # PyPI.orgはenvironmentのtag制限に従い、公開済みtagをrefに指定する（promoteは実行しない）。
  workflow_dispatch:
    inputs:
      tag:
        description: "publish する既存 Release の tag（先頭のvを含む）"
        required: true
        type: string
      channel:
        description: "既存Releaseの公開先"
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi

permissions:
  contents: write
  actions: read

jobs:
  promote:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the commit the release tag points to
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG_NAME="${{ github.event.release.tag_name }}"
          SOURCE_COMMIT=$(gh api "repos/${{ github.repository }}/commits/$TAG_NAME" -q .sha)
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"

      - name: Find the matching successful ci.yml run for that commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh api --method GET "repos/${{ github.repository }}/actions/workflows/ci.yml/runs" \
            -f head_sha="$SOURCE_COMMIT" -f status=success -q '.workflow_runs[0].id')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::commit $SOURCE_COMMIT に対応する成功済み ci.yml run が見つからない。release.yml は再build しない設計のため自動フォールバックしない -- このcommitで ci.yml を再実行（再push または workflow_dispatch）してから、あらためて release を作成し直してください（retention-days=90 を超えている場合も同様）"
            exit 1
          fi
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Download the candidate artifact (bytes unchanged)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -n minecraft-remote-api-dist -D dist-candidate --repo "${{ github.repository }}"
          WHEEL=$(find dist-candidate -name '*.whl')
          SDIST=$(find dist-candidate -name '*.tar.gz')
          CANDIDATE_MANIFEST=$(find dist-candidate -name 'manifest.json')
          echo "WHEEL=$WHEEL" >> "$GITHUB_ENV"
          echo "SDIST=$SDIST" >> "$GITHUB_ENV"
          echo "CANDIDATE_MANIFEST=$CANDIDATE_MANIFEST" >> "$GITHUB_ENV"

      - name: Verify the release tag matches the candidate wheel's version
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG_NAME#v}"
          PROJECT_VERSION=$(basename "$WHEEL" | sed -E 's/^minecraft_remote_api-(.+)-py3-none-any\.whl$/\1/')
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::tag '$TAG_NAME' の version '$TAG_VERSION' が候補wheelの version '$PROJECT_VERSION' と一致しない（version bumpを忘れていませんか）"
            exit 1
          fi
          echo "TAG_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Set the release title (minecraft-remote-api <version>)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 命名規則は mc-remote-knowledge versioning-design §10.12.1（DECISIONS 2026-09-27-03）。
          # GitHub の既定（tag 名）に任せず、固定 trigger で明示指定する
          gh release edit "$TAG_NAME" --repo "${{ github.repository }}" \
            --title "minecraft-remote-api $TAG_VERSION"

      - name: Verify the prerelease flag matches the version suffix
        run: |
          set -euo pipefail
          if [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(b|rc)[0-9]+ ]]; then
            if [ "${{ github.event.release.prerelease }}" != "true" ]; then
              echo "::error::'$TAG_NAME' は pre-release 形式だが GitHub release 側に prerelease フラグが立っていない"
              exit 1
            fi
          else
            if [ "${{ github.event.release.prerelease }}" != "false" ]; then
              echo "::error::'$TAG_NAME' は stable 形式だが GitHub release 側に prerelease フラグが立っている"
              exit 1
            fi
          fi

      - name: Verify downloaded bytes match what ci.yml tested
        run: |
          set -euo pipefail
          for role_file in "wheel:$WHEEL" "sdist:$SDIST"; do
            role="${role_file%%:*}"
            file="${role_file#*:}"
            actual=$(sha256sum "$file" | cut -d' ' -f1)
            expected=$(jq -r --arg r "$role" '.artifacts[] | select(.role==$r) | .sha256' "$CANDIDATE_MANIFEST")
            if [ "$actual" != "$expected" ]; then
              echo "::error::$role の sha256 が候補 manifest の記録値と不一致（download破損等）"
              exit 1
            fi
          done

      - name: Relabel manifest.json with the actual release tag
        run: |
          set -euo pipefail
          jq --arg t "$TAG_NAME" '.release_tag = $t' "$CANDIDATE_MANIFEST" > manifest.json
          cat manifest.json

      - name: Attach wheel, sdist and manifest.json to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$TAG_NAME" "$WHEEL" "$SDIST" manifest.json \
            --repo "${{ github.repository }}" --clobber

  # 両indexが同じ検証済みRelease assetを使う。buildは行わない。
  prepare-publication:
    needs: promote
    if: >-
      ${{ !cancelled() && (needs.promote.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && needs.promote.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      pypi_eligible: ${{ steps.resolve.outputs.pypi_eligible }}
    steps:
      - name: Resolve the published Release tag
        id: resolve
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export TAG_NAME="${EVENT_TAG:-$INPUT_TAG}"
          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((b|rc)[0-9]+)?(\.post[0-9]+)?$ ]]; then
            echo "::error::tag '$TAG_NAME' は release tag の形式ではない"
            exit 1
          fi
          SOURCE_COMMIT=$(gh api "repos/${{ github.repository }}/commits/$TAG_NAME" -q .sha)
          DRAFT=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG_NAME" -q .draft)
          if [ "$DRAFT" != "false" ]; then
            echo "::error::公開済みGitHub Releaseのassetだけをindexへ送る"
            exit 1
          fi
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          # matureはb9から。過去のbetaをdispatchしてもPyPI.orgへは出さない。
          python - <<'PYPI_FLOOR'
          import os
          import re
          match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)(?:(b|rc)(\d+))?(?:\.post\d+)?", os.environ["TAG_NAME"])
          base = tuple(int(match[i]) for i in (1, 2, 3))
          eligible = base > (2320, 0, 0) or (
              base == (2320, 0, 0) and (match[4] != "b" or int(match[5]) >= 9)
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"pypi_eligible={str(eligible).lower()}\n")
          PYPI_FLOOR

      - name: Download the Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$TAG_NAME" --repo "${{ github.repository }}" -D release-assets \
            -p '*.whl' -p '*.tar.gz' -p manifest.json

      - name: Verify the assets against manifest.json
        run: |
          set -euo pipefail
          MANIFEST=release-assets/manifest.json
          if [ "$(jq -r .release_tag "$MANIFEST")" != "$TAG_NAME" ]; then
            echo "::error::manifest.json の release_tag が '$TAG_NAME' と一致しない"
            exit 1
          fi
          if [ "$(jq -r .source_commit "$MANIFEST")" != "$SOURCE_COMMIT" ]; then
            echo "::error::manifest.json の source_commit が tag の commit $SOURCE_COMMIT と一致しない"
            exit 1
          fi
          mkdir dist
          for role in wheel sdist; do
            file=$(jq -r --arg r "$role" '.artifacts[] | select(.role==$r) | .file' "$MANIFEST")
            expected=$(jq -r --arg r "$role" '.artifacts[] | select(.role==$r) | .sha256' "$MANIFEST")
            actual=$(sha256sum "release-assets/$file" | cut -d' ' -f1)
            if [ "$actual" != "$expected" ]; then
              echo "::error::$file の sha256 が manifest.json の記録値と一致しない"
              exit 1
            fi
            mv "release-assets/$file" dist/
          done
          VERSION=$(basename dist/*.whl | sed -E 's/^minecraft_remote_api-(.+)-py3-none-any\.whl$/\1/')
          if [ "$VERSION" != "${TAG_NAME#v}" ]; then
            echo "::error::wheel の version '$VERSION' が tag '$TAG_NAME' と一致しない"
            exit 1
          fi
          cp "$MANIFEST" dist/manifest.json
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # 現行の予行経路は公開時に自動実行する。手動のみに絞る変更は後続作業。
  publish-testpypi:
    needs: prepare-publication
    if: >-
      ${{ !cancelled() && needs.prepare-publication.result == 'success' &&
      (github.event_name == 'release' || inputs.channel == 'testpypi' || inputs.channel == '') }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/minecraft-remote-api
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-assets
          path: release-assets

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"

      - name: Publish to TestPyPI (Trusted Publishing)
        run: |
          set -euo pipefail
          uv publish --trusted-publishing always \
            --publish-url https://test.pypi.org/legacy/ \
            --check-url https://test.pypi.org/simple/ \
            release-assets/*.whl release-assets/*.tar.gz

  # matureはb9から。公開承認後にPYPI_PUBLISH_ENABLED=trueで有効化する。
  # 未設定／falseならrelease／dispatchの両方で公開しない。
  publish-pypi:
    needs: prepare-publication
    if: >-
      ${{ vars.PYPI_PUBLISH_ENABLED == 'true' && !cancelled() &&
      needs.prepare-publication.result == 'success' &&
      needs.prepare-publication.outputs.pypi_eligible == 'true' &&
      (github.event_name == 'release' || inputs.channel == 'pypi') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/minecraft-remote-api
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-assets
          path: release-assets

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"

      - name: Publish to PyPI.org (Trusted Publishing)
        run: |
          set -euo pipefail
          uv publish --trusted-publishing always \
            --publish-url https://upload.pypi.org/legacy/ \
            --check-url https://pypi.org/simple/ \
            release-assets/*.whl release-assets/*.tar.gz

      - name: Verify the PyPI.org files match the Release assets
        env:
          TAG_NAME: ${{ needs.prepare-publication.outputs.tag_name }}
        run: |
          python - <<'PYPI'
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.request

          manifest = json.loads(Path("release-assets/manifest.json").read_text())
          version = os.environ["TAG_NAME"][1:]
          url = f"https://pypi.org/pypi/minecraft-remote-api/{version}/json"
          with urllib.request.urlopen(url, timeout=30) as response:
              published = json.load(response)
          if published["info"]["version"] != version:
              raise SystemExit("PyPI version does not match the release tag")
          files = {entry["filename"]: entry for entry in published["urls"]}
          for artifact in manifest["artifacts"]:
              name = artifact["file"]
              entry = files[name]
              body = (Path("release-assets") / name).read_bytes()
              expected = artifact["sha256"]
              if (hashlib.sha256(body).hexdigest() != expected
                      or entry["digests"]["sha256"] != expected
                      or entry["size"] != len(body) or entry["yanked"]):
                  raise SystemExit(f"PyPI artifact does not match the Release: {name}")
              print(f"{name}: {entry['size']} bytes, SHA-256 {expected}")
          print(f"https://pypi.org/project/minecraft-remote-api/{version}/")
          PYPI
