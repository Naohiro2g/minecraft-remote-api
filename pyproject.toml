[project]
name = "minecraft-remote-api"
version = "2000.0.0"
description = "Python Client-API for Minecraft Remote or mc-remote"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["minecraft", "remote", "API", "client"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
authors = [
    { name = "Naohiro2g", email = "587586+Naohiro2g@users.noreply.github.com" }
]
dependencies = [
    "pygame-ce>=2.5.7,<3",
]

[project.urls]
Homepage = "https://github.com/Naohiro2g/minecraft-remote-api"
Repository = "https://github.com/Naohiro2g/minecraft-remote-api"
Documentation = "https://github.com/Naohiro2g/minecraft-remote-api/blob/main/README.md"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# 配布名(minecraft-remote-api) と import名(mc_remote) が異なるため明示
module-name = "mc_remote"
# src/ を使わずリポ直下に mc_remote/ を置くフラット配置のため
module-root = ""
